name: Keep Supabase Alive

on:
  schedule:
    # Every 6 hours. Supabase docs say "a few user requests to the database each
    # day over the previous week" is what keeps a Free plan project awake, so one
    # request a day sits right on the threshold rather than above it.
    # Minute 17 on purpose: GitHub drops queued scheduled jobs under load, and
    # load peaks at the top of the hour.
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Validate secrets
        run: |
          fail=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::secret SUPABASE_URL is empty or not set"
            fail=1
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::secret SUPABASE_KEY is empty or not set"
            fail=1
          fi
          exit $fail

      - name: Check project host resolves
        run: |
          host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#/.*$##')
          if ! getent hosts "$host" > /dev/null; then
            echo "::error::DNS lookup failed for the Supabase project host."
            echo "::error::On the free tier this almost always means the project is PAUSED --"
            echo "::error::Supabase tears down DNS for paused projects. Less commonly it was deleted."
            echo "::error::Go to https://supabase.com/dashboard and click 'Resume project'."
            echo "::error::Then confirm the Project ID under Settings > General still matches the"
            echo "::error::SUPABASE_URL secret, and update the secret if it does not."
            echo "::error::Note: this workflow cannot wake a paused project, only keep a live one awake."
            exit 1
          fi
          echo "Host resolved."

      - name: Ping Supabase Database
        run: |
          # Several queries per run, not one. The threshold is described as
          # "a few requests each day", so volume is the point.
          failed=0
          for table in games players rounds; do
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
              -X GET "${SUPABASE_URL}/rest/v1/${table}?select=id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}") || {
                echo "::error::curl failed to complete the request for ${table} (exit $?)"
                failed=1
                continue
              }

            echo "${table}: HTTP ${code}"

            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              continue
            fi

            failed=1
            case "$code" in
              401|403) echo "::error::Auth rejected ($code) on ${table}. The SUPABASE_KEY secret is wrong, expired, or lacks access." ;;
              404)     echo "::error::404 — table ${table} or the /rest/v1 endpoint was not found at this project." ;;
              5*)      echo "::error::Supabase returned $code on ${table}. The project may be paused or having an outage." ;;
              *)       echo "::error::Unexpected HTTP status $code on ${table}." ;;
            esac
            echo "Response body:"
            cat /tmp/body.txt
          done

          if [ "$failed" -eq 0 ]; then
            echo "All pings succeeded."
            exit 0
          fi

          exit 1
